<script>
        // Micro-interaction for the Google Button
        const googleBtn = document.getElementById('google-connect');
        if (googleBtn) {
            googleBtn.addEventListener('click', function() {
                this.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="font-semibold">Authorizing...</span>
                `;
                this.classList.add('opacity-80', 'pointer-events-none');
                
                // Simulate redirection
                setTimeout(() => {
                    console.log('Redirecting to Google OAuth flow...');
                }, 1500);
            });
        }

        // Logic for high-stakes surgical feel: adding a subtle coordinate flicker or data stream effect
        const createCoordinateOverlay = () => {
            const canvas = document.createElement('div');
            canvas.className = 'fixed inset-0 pointer-events-none z-20 opacity-[0.03] font-label-sm text-label-sm overflow-hidden select-none';
            document.body.appendChild(canvas);

            setInterval(() => {
                const x = Math.floor(Math.random() * window.innerWidth);
                const y = Math.floor(Math.random() * window.innerHeight);
                const data = `SECURE_NODE_${Math.random().toString(36).substring(7).toUpperCase()}`;
                
                const marker = document.createElement('div');
                marker.className = 'absolute transition-opacity duration-1000';
                marker.style.left = `${x}px`;
                marker.style.top = `${y}px`;
                marker.innerText = data;
                canvas.appendChild(marker);

                setTimeout(() => marker.style.opacity = '0', 500);
                setTimeout(() => marker.remove(), 1500);
            }, 800);
        };

        createCoordinateOverlay();
    </script>
