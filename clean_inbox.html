<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error": "#ba1a1a",
                    "on-tertiary-container": "#ffbf95",
                    "on-surface-variant": "#42474a",
                    "on-secondary-container": "#fffbff",
                    "outline-variant": "#c2c7ca",
                    "on-primary-container": "#bad0dc",
                    "surface-dim": "#d9dadb",
                    "primary-fixed-dim": "#b4cad6",
                    "surface-bright": "#f8f9fa",
                    "surface-container-low": "#f3f4f5",
                    "on-tertiary-fixed": "#311300",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e7e8e9",
                    "background": "#f8f9fa",
                    "surface-tint": "#4c616c",
                    "secondary-fixed": "#ffdad6",
                    "on-secondary-fixed": "#410003",
                    "secondary-fixed-dim": "#ffb3ac",
                    "outline": "#73787b",
                    "tertiary-fixed": "#ffdcc6",
                    "primary": "#2e434c",
                    "on-surface": "#191c1d",
                    "primary-container": "#455a64",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#673000",
                    "on-background": "#191c1d",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e1e3e4",
                    "surface-container-highest": "#e1e3e4",
                    "primary-fixed": "#cfe6f2",
                    "tertiary-fixed-dim": "#ffb786",
                    "surface-container": "#edeeef",
                    "secondary": "#b6171e",
                    "on-primary-fixed-variant": "#354a53",
                    "on-tertiary-fixed-variant": "#723600",
                    "on-secondary-fixed-variant": "#930010",
                    "inverse-primary": "#b4cad6",
                    "secondary-container": "#da3433",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#071e27",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#2e3132",
                    "inverse-on-surface": "#f0f1f2",
                    "tertiary-container": "#8a4300",
                    "surface": "#f8f9fa"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "stack-md": "16px",
                    "container-margin": "16px",
                    "gutter": "12px",
                    "tap-target-min": "44px",
                    "stack-lg": "24px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "label-sm": ["JetBrains Mono"],
                    "body-sm": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "label-md": ["JetBrains Mono"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-sm": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["13px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f8f9fa;
            color: #191c1d;
            -webkit-font-smoothing: antialiased;
        }
        .surgical-card {
            border: 1px solid #E0E0E0;
            background: white;
        }
        .hard-shadow {
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-container-margin h-tap-target-min z-50">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="security">security</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">SpamReaper</h1>
</div>
<button class="w-tap-target-min h-tap-target-min flex items-center justify-center hover:bg-surface-container-high transition-colors active:opacity-80 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="sync">sync</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-stack-lg">
<div class="w-full max-w-md flex flex-col items-center text-center space-y-stack-lg">
<!-- Zen Illustration Area (Bento-ish framing) -->
<div class="relative w-full aspect-square max-w-[280px] flex items-center justify-center">
<!-- Background decorative elements for "Zen" feel -->
<div class="absolute inset-0 bg-surface-container-low rounded-full opacity-40 scale-90 border border-outline-variant"></div>
<div class="absolute inset-0 bg-surface-container-lowest rounded-full scale-75 border border-outline-variant shadow-sm"></div>
<!-- Primary Icon -->
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-outline text-[80px]" data-icon="shield_with_heart" style="font-variation-settings: 'wght' 200;">shield_with_heart</span>
<div class="mt-4 flex items-center gap-2 px-3 py-1 bg-primary-container text-on-primary-container rounded-full">
<span class="material-symbols-outlined text-label-sm" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Secured</span>
</div>
</div>
</div>
<!-- Empty State Message -->
<div class="space-y-stack-sm">
<h2 class="font-headline-md text-headline-md font-bold text-on-surface">No spam to review — nice and clean!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                    Your inbox is looking sharp. We'll notify you when new items arrive.
                </p>
</div>
<!-- Action / Status -->
<div class="pt-stack-md">
<div class="surgical-card p-4 rounded-lg flex items-center gap-4 text-left border-l-4 border-l-primary-container">
<div class="p-2 bg-surface-container-high rounded">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome">auto_awesome</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary font-bold">REAPER AI ACTIVE</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Scanning background streams...</p>
</div>
</div>
</div>
<!-- Visualization of "Cleanliness" -->
<div class="w-full grid grid-cols-3 gap-gutter mt-stack-lg">
<div class="h-1 bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-full transition-all duration-1000"></div>
</div>
<div class="h-1 bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-full transition-all duration-1000 delay-100"></div>
</div>
<div class="h-1 bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-full transition-all duration-1000 delay-200"></div>
</div>
</div>
</div>
</main>
<!-- Spacer for fixed BottomNav -->
<div class="h-16"></div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-container-margin pb-stack-sm h-16 bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline z-50">
<!-- Inbox (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim border-t-2 border-primary dark:border-primary-fixed-dim pt-2 hover:bg-surface-container-low transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="inbox" style="font-variation-settings: 'FILL' 1;">inbox</span>
<span class="font-label-md text-label-md">Inbox</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-2 hover:bg-surface-container-low transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-2 hover:bg-surface-container-low transition-colors active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<script>
        // Micro-interaction: Subtle pulse for the "Secured" badge
        document.addEventListener('DOMContentLoaded', () => {
            const badge = document.querySelector('.bg-primary-container');
            if (badge) {
                setInterval(() => {
                    badge.style.opacity = '0.9';
                    setTimeout(() => { badge.style.opacity = '1'; }, 1000);
                }, 2000);
            }
        });
    </script>
</body></html>
